name: Bug Report / 缺陷报告
description: Report a bug or unexpected behavior / 报告错误或异常行为
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem Description / 问题描述
      description: Describe the bug clearly (English or Simplified Chinese). / 请清晰描述遇到的问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce / 复现步骤
      placeholder: |
        1. Open ...
        2. Trigger ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria / 验收标准
      value: |
        - [ ] Root cause fixed without regressions
        - [ ] Relevant tests and CI checks pass
    validations:
      required: true
