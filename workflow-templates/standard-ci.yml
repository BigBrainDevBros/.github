name: Standard CI

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

permissions:
  contents: read

jobs:
  quality:
    name: Repository Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate YAML Files
        run: |
          ruby -ryaml -e '
            Dir.glob(".github/**/*.{yml,yaml}").each do |f|
              YAML.safe_load(File.read(f))
              puts "Validated: #{f}"
            end
          '

      - name: Verify Commit Message Conventions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -c '
          import subprocess, re, os
          pattern = re.compile(r"^[a-z]+: [a-z0-9]+ [a-z0-9]+ [a-z0-9]+$")
          base_sha = os.environ.get("BASE_SHA", "")
          rev_range = f"{base_sha}..HEAD" if base_sha and not re.match(r"^0+$", base_sha) else "HEAD~1..HEAD"
          try:
              commits = subprocess.check_output(["git", "log", rev_range, "--format=%H %s"]).decode().strip().split("\n")
          except Exception:
              commits = subprocess.check_output(["git", "log", "-1", "--format=%H %s"]).decode().strip().split("\n")
          for c in [x for x in commits if x.strip()]:
              sha, msg = c.split(" ", 1)
              if msg.startswith("Merge "):
                  continue
              if not pattern.match(msg):
                  raise SystemExit(f"Invalid commit message {sha[:7]}: {msg}")
          print("Commit message check passed.")
          '
